[workspace]
members = [
    ".",
    "crates/regis-model",
    "crates/regis-core",
    "crates/regis-stt-whisper",
    "crates/regis-voice",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "net"] }
futures = "0.3"
ts-rs = "12.0.1"
rusqlite = { version = "0.40", features = ["bundled"] }
sqlite-vec = "=0.1.9"
keyring = "4.2.0"
ulid = "3.0.0"
notify = "8.2.0"
pdf-extract = "0.12.1"
zip = { version = "7.3.0", default-features = false, features = ["deflate"] }
quick-xml = "0.42.0"
calamine = "0.35.0"
sha2 = "0.10.9"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "stream", "native-tls"] }
base64 = "=0.23.1"
bytes = "1.12.1"
url = "2.5.8"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
regis-model = { path = "crates/regis-model" }
regis-core = { path = "crates/regis-core" }
regis-stt-whisper = { path = "crates/regis-stt-whisper" }
regis-voice = { path = "crates/regis-voice" }

[package]
name = "regis-desktop"
version.workspace = true
description = "Régis desktop shell (Personal Command Center)"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "regis_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
regis-model = { workspace = true }
regis-core = { workspace = true }
regis-voice = { workspace = true }
regis-stt-whisper = { workspace = true }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
rusqlite = { workspace = true }
ts-rs = { workspace = true }
ulid = { workspace = true }
portable-pty = "=0.9.0"
base64 = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
tauri-plugin-opener = "2.7.2"
tauri-plugin-updater = "2.14.0"
url = { workspace = true }

[dev-dependencies]
regis-core = { workspace = true, features = ["test-util"] }
regis-voice = { workspace = true, features = ["test-util"] }

[features]
# GPU Vulkan pour whisper.cpp (désactivée par défaut).
stt-vulkan = ["regis-stt-whisper/vulkan"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5.4"

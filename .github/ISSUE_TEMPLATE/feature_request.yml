name: Feature request
description: Suggest an improvement or a new feature.
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! For open-ended ideas, a Discussion may be a better place to start.
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe the need or the situation, rather than the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you imagine it working.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself

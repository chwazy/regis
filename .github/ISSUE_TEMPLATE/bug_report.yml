name: Bug report
description: Something does not work as expected.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues first.
        **Security issues must not be reported here** — see the security policy.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version of the installer you ran, or the commit you built.
      placeholder: e.g. 0.2.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options:
        - Windows installer from a release
        - Built from source
        - Development (npm run dev)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11 24H2
  - type: input
    id: agents
    attributes:
      label: Agents and connectors involved
      placeholder: e.g. Claude Code CLI, Ollama, Microsoft 365
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. Remove any secret, token, e-mail content or personal data first.
      render: shell
